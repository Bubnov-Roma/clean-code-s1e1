<html>
  <!DOCTYPE html>
  <html lang="en"></html>
  <head>
    <title>Todo App</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0">
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
  <article class="header-block">
    <img class="header-block-img" alt="todo list image" src="./eisenhower-matrix.jpg">
    <a 
      class="header-block-link" 
      href="https://goal-life.com/page/method/matrix-eisenhower"
    >
    Want more details?
    </a>
  </article>
  <article class="form-block">
    <section id="add-item">
      <label for="new-task">Add Item</label>
      <div class="add-item-text">
        <input id="new-task"class="input-task" type="text">
        <button>Add</button>
      </div>
    </section>
    <h3>Todo</h3>
    <section id="incomplete-tasks">
      <li>
        <input type="checkbox">
        <label class="task">Pay Bills</label>
        <input type="text" class="input-task">
        <button class="edit">Edit</button>
        <button class="delete">
          <img alt="delete icon" src="./remove.svg">
        </button>
      </li>
      <li class="edit-mode">
        <input type="checkbox">
        <label class="task">Go Shopping</label>
        <input type="text" value="Go Shopping" class="input-task">
        <button class="edit">Save</button>
        <button class="delete">
          <img alt="delete icon" src="./remove.svg">
        </button>
      </li>
    </section>
    <h3>Completed</h3>
    <section id="completed-tasks">
      <li>
        <input type="checkbox" checked>
        <label class="task">See the Doctor</label>
        <input type="text" class="input-task">
        <button class="edit">Edit</button>
        <button class="delete">
          <img alt="delete icon" src="./remove.svg">
        </button>
      </li>
    </section>
  </article>
  <script src="app.js"></script>
  </body>
</html>
